<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1d6e">
  <title>30 Seconds</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="30 Seconds">
      <img src="/static/logo.svg" alt="" width="44" height="44">
      <span class="wordmark">SECONDS</span>
    </a>
    <div class="header-buttons">
      <button id="sound-btn" class="icon-btn" type="button" aria-label="Sound on/off">🔊</button>
      <button id="ui-lang" class="icon-btn" type="button" aria-label="Switch interface language">NL</button>
    </div>
  </header>

  <main id="app">
    <!-- Home: create or join a room -->
    <section id="screen-home" class="screen" hidden>
      <div class="hero">
        <img class="hero-logo" src="/static/logo.svg" alt="" width="120" height="120">
        <div class="hero-title">30 SECONDS</div>
        <p class="tagline" data-t="tagline"></p>
      </div>

      <div class="card">
        <label><span data-t="yourName"></span>
          <input id="name" maxlength="20" autocomplete="nickname">
        </label>
      </div>

      <div class="card">
        <h2 data-t="joinRoom"></h2>
        <label><span data-t="roomCode"></span>
          <input id="join-code" maxlength="4" autocapitalize="characters" autocomplete="off" class="code-input">
        </label>
        <button id="join-btn" class="btn primary" data-t="join"></button>
      </div>

      <div class="card">
        <h2 data-t="newGame"></h2>
        <label><span data-t="wordLanguage"></span>
          <select id="lang">
            <option value="nl">🇳🇱 Nederlands</option>
            <option value="en">🇬🇧 English</option>
          </select>
        </label>
        <div class="row">
          <label><span data-t="teams"></span>
            <select id="teams">
              <option>2</option><option>3</option><option>4</option>
            </select>
          </label>
          <label><span data-t="target"></span>
            <input id="target" type="number" min="5" max="100" value="30">
          </label>
        </div>
        <label id="password-row" hidden><span data-t="password"></span>
          <input id="password" type="password" autocomplete="current-password">
        </label>
        <button id="create-btn" class="btn accent" data-t="create"></button>
      </div>

      <details class="card rules">
        <summary data-t="howToPlay"></summary>
        <p data-t="rulesText"></p>
      </details>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen" hidden>
      <div class="card center">
        <div class="label-small" data-t="roomCode"></div>
        <div id="lobby-code" class="big-code"></div>
        <button id="share-btn" class="btn secondary" data-t="shareLink"></button>
      </div>
      <p class="hint" data-t="pickTeam"></p>
      <div id="lobby-teams" class="teams"></div>
      <div id="host-controls" class="stack">
        <button id="shuffle-btn" class="btn secondary" data-t="shuffle"></button>
        <button id="start-btn" class="btn primary big" data-t="startGame"></button>
      </div>
      <p id="wait-host" class="hint" data-t="waitHost"></p>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen" hidden>
      <div id="board" class="card board"></div>
      <div id="turn" class="card center turn"></div>
    </section>

    <!-- Finished -->
    <section id="screen-finished" class="screen" hidden>
      <div class="card center">
        <div class="trophy">🏆</div>
        <h2 id="winner-text" class="winner"></h2>
        <div id="final-board" class="board"></div>
        <button id="again-btn" class="btn primary big" data-t="playAgain"></button>
        <p id="wait-host-again" class="hint" data-t="waitHost"></p>
      </div>
    </section>
  </main>

  <footer>
    <div id="host-line" class="host-line" hidden></div>
    <button id="leave-btn" class="link" data-t="leave" hidden></button>
  </footer>

  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog card" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-icon">🚪</div>
      <h2 id="dialog-title"></h2>
      <div id="dialog-body" class="dialog-body"></div>
      <div class="stack">
        <button id="dialog-no" class="btn primary"></button>
        <button id="dialog-yes" class="btn accent"></button>
      </div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="/static/app.js"></script>
</body>
</html>
